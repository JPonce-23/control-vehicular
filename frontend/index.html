<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Control Vehicular</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login">

    <h1>Control vehicular</h1>

    <div class="contenedor">

    <img src="assets/LOGO PA.png" alt="Logo PA" class="logo-pa">

    <!--<h2>Inicio de sesión</h2>-->

    <form id="loginForm">
        <div class="elemento">
            <label>Correo:</label>
            <input type="email" id="correo" required>
        </div>

        <div class="elemento">
            <label>Contraseña:</label>
            <input type="password" id="password" required>
        </div>

        <button class="btnlogin" type="submit">Iniciar sesión</button>
    </form>
    </div>


    <footer>
        <p>&copy; 2026 Procuraduría Agraria. Todos los derechos reservados.</p>
    </footer>

    <p id="mensaje"></p>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
