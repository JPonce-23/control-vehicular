<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario del vehículo</title>
</head>
<body data-roles="administrador,capturista">
    
    <h1>Inventario del vehículo</h1>

    <button onclick="window.location.href='../dashboard.html'">
        Volver al dashboard
    </button> 
    
    <br><br>

    <label for="salida_id">*Selecciona una salida:</label>
    <br>
    <select name="salida_id" id="salida_id">
        <option value="">Selecciona una salida</option>
    </select>

    <br><br>

    <fieldset>
        <legend>Revisión de inventario</legend>

        <div id="inventarioContainer">
            Selecciona una salida para cargar el inventario.
        </div>

        <br>

        <button id="btnGuardarInventario" type="button">
            Guardar inventario
        </button>
    </fieldset>

    <p id="mensaje"></p>

    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/inventario.js"></script>

</body>
</html>
