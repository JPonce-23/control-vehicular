<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regreso</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-roles="administrador,capturista">


<header class="app-header">
        <div>
            <h1>Control vehicular</h1>
            <p>Procuraduría Agraria</p>
        </div>

        <button class="btn btn-secondary" type="button" onclick="window.location.href='../dashboard.html'">
            Volver al menú
        </button>
    </header>

<main class="app-main">

    
    
    <section class="page-title">
        <h2>Registrar regreso</h2>
    </section>


    <section class="card">
        <form id="regresoForm" class="form-grid" method="POST" autocomplete="off">
            <fieldset>
                <legend>Registra un regreso</legend>

                <div class="form-group">
                    <label for="salida_id">*Selecciona una salida:</label> 
                    <select name="salida" id="salida_id" required>
                        <option value="">Selecciona una salida</option>
                    </select> 
                </div>

                <div class="form-group">
                    <label for="fecha_regreso">*Selecciona la fecha del regreso:</label> 
                    <input type="datetime-local" id="fecha_regreso" name="fecha_regreso" required> 
                </div>

                <div class="form-group">
                    <label for="km_odometro_regreso">*Kilometraje de regreso:</label> 
                    <input type="number" step="0.01" name="km_odometro_regreso" id="km_odometro_regreso" required>
                </div>

                <div class="form-group">
                    <label for="nivel_gasolina_regreso">*Nivel de gasolina del regreso:</label>
                    <select name="nivel_gasolina_regreso" id="nivel_gasolina_regreso" required>
                        <option value="vacio">0</option>
                        <option value="cuarto">1/4</option>
                        <option value="medio">1/2</option>
                        <option value="tres_cuartos">3/4</option>
                        <option value="lleno">4/4</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="saldo_tarjeta_regreso">*Saldo final de tarjeta:</label>
                    <input type="number" id="saldo_tarjeta_regreso" name="saldo_tarjeta_regreso" min="0" step="0.01" required>
                </div>


                <div class="form-group">
                    <label for="estado_llantas_regreso">*Nivel de llantas:</label> 
                    <select name="estado_llantas_regreso" id="estado_llantas_regreso" required>
                        <option value="cuarto">1/4</option>
                        <option value="medio">2/4</option>
                        <option value="tres_cuartos">3/4</option>
                        <option value="lleno">4/4</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado_vehiculo_regreso">*Estado en el que regresó el vehículo:</label>
                    <select name="estado_vehiculo_regreso" id="estado_vehiculo_regreso" required>
                        <option value="bueno">Bueno</option>
                        <option value="dañado">Dañado</option>
                        <option value="mantenimiento">Mantenimiento</option>
                    </select> 
                </div>

                <div class="form-group">
                    <label for="finalidad_devolucion">*Finalidad del regreso del vehículo:</label> 
                    <select name="finalidad_devolucion" id="finalidad_devolucion" required>
                        <option value="disponible">Disponible</option>
                        <option value="reparacion">Reparacion</option>
                        <option value="sustitucion">Sustitucion</option>
                    </select> 
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones:</label> 
                    <input type="text" name="observaciones" id="observaciones"> 
                </div>

                <input type="submit" class="btn btn-primary" value="Registrar regreso">

            </fieldset>

        </form>
    </section>
    
    <p id="mensaje"></p>

    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/regreso.js"></script>

</main>
</body>
</html>
