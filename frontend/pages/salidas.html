<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de salidas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-roles="administrador,capturista">


<header class="app-header">
    <div>
        <h1>Control vehicular</h1>
        <p>Procuraduría Agraria</p>
    </div>

    <button class="btn btn-secondary" type="button" onclick="window.location.href='../dashboard.html'">
        Volver al menú
    </button>
</header>



<main class="app-main">


    <section class="page-title">
        <h2>Registrar salida</h2>
    </section>


    <section class="card">
        <form id="salidaForm" class="form-grid" method="POST" autocomplete="off">
            <fieldset>
                <legend>Registra una salida</legend>

                <div class="form-group">
                    <label for="vehiculo_id">*Elige un vehículo:</label> 
                    <select name="vehiculo" id="vehiculo_id" required>
                        <option value="">Selecciona un vehículo</option>
                    </select> 
                </div>

                <div id="saldoTarjetaVehiculo" class="message ok" hidden></div>

                <div class="form-group">
                    <label for="monto_agregado_tarjeta">Agregar monto a tarjeta:</label>
                    <input type="number" id="monto_agregado_tarjeta" name="monto_agregado_tarjeta" min="0" step="0.01" value="0">
                </div>

                <div class="form-group">
                    <label for="persona_id">*Elige una persona:</label> 
                    <select name="persona" id="persona_id" required>
                        <option value="">Selecciona una persona</option>
                    </select> 
                </div>

                <!--
                <div class="form-group">
                    <label for="num_oficio">Numero de oficio:</label> 
                    <input type="text" name="num_oficio" id="num_oficio">
                </div> 

                <div class="form-group">
                    <label for="num_expediente">Numero de expediente:</label> 
                    <input type="text" name="num_expediente" id="num_expediente">
                </div> 
                
                <div class="form-group">
                    <label for="area_en_viaje">Área de viaje:</label> 
                    <input type="text" name="area_en_viaje" id="area_en_viaje"> 
                </div>
                
                <div class="form-group">
                    <label for="tipo_movimiento">*Tipo de movimiento:</label>
                    <select name="tipo_movimiento" id="tipo_movimiento" required>
                        <option value="">Selecciona un tipo de movimiento</option>
                        <option value="asignacion">Asignación</option>
                        <option value="devolucion">Devolución</option>
                    </select>
                </div> -->

                <!-- Todos los resguardos son provisionales; se fija el valor de forma fija. -->
                <input type="hidden" name="forma_movimiento" id="forma_movimiento" value="provisional">
                
                <div class="form-group">
                    <label for="fecha_salida">*Fecha de salida:</label>
                    <input type="date" id="fecha_salida" name="fecha_salida" required>
                </div>

             <!--   <div class="form-group">
                    <label for="fecha_fin_provisional">Fecha fin provisional:</label>
                    <input type="date" id="fecha_fin_provisional" name="fecha_fin_provisional">
                </div> -->


                <div class="form-group">
                    <label for="fecha_regreso_estimada">Fecha de regreso:</label>
                    <input type="date" id="fecha_regreso_estimada" name="fecha_regreso_estimada">
                </div>

                <!-- 
                <div class="form-group">
                    <label for="finalidad_uso">*Finalidad de uso:</label> 
                    <input type="text" name="finalidad_uso" id="finalidad_uso" required> 
                </div> -->

                <div class="form-group">
                    <label for="km_odometro_salida">*Kilometraje de salida:</label> 
                    <input type="number" name="km_odometro_salida" id="km_odometro_salida" required>
                </div>

                <div class="form-group">
                    <label for="nivel_gasolina_salida">*Nivel de gasolina de salida:</label> 
                    <select name="nivel_gasolina_salida" id="nivel_gasolina_salida" required>
                        <option value="vacio">0</option>
                        <option value="cuarto">1/4</option>
                        <option value="medio">2/4</option>
                        <option value="tres_cuartos">3/4</option>
                        <option value="lleno">4/4</option>
                    </select> 
                </div>
                
                <div class="form-group">
                    <label for="estado_llantas_salida">*Nivel de llantas:</label> 
                    <select name="estado_llantas_salida" id="estado_llantas_salida" required>
                        <option value="cuarto">1/4</option>
                        <option value="medio">2/4</option>
                        <option value="tres_cuartos">3/4</option>
                        <option value="lleno">4/4</option>
                    </select> 
                </div>
                
                <div class="form-group">
                    <label for="observaciones">Observaciones:</label> 
                    <input type="text" name="observaciones" id="observaciones"> 
                </div>
                
                <div class="form-group">
                    <label for="observaciones_croquis">Observaciones en croquis:</label> 
                    <input type="text" name="observaciones_croquis" id="observaciones_croquis">                 
                </div>


                <input class="btn btn-primary" type="submit" value="Registrar salida">

            </fieldset>

        </form>
    </section>



    <div id="panelConfirmacion" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <h3 style="margin-top: 0;">¡Salida registrada con éxito!</h3>
            <p>Elige una opción</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="btnGenerarResguardo" class="btn btn-primary" type="button">Generar Resguardo</button>
                <button id="btnVolverListado" class="btn btn-secondary" type="button">Volver al menú</button>
            </div>
        </div>
    </div>

    <p id="mensaje" class="message"></p>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/salidas.js"></script>

</main>
</body>
</html>
