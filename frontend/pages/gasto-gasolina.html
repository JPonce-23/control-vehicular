<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasto de gasolina</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="app-page" data-roles="administrador,capturista">


<header class="app-header">
    <div>
        <h1>Control vehicular</h1>
        <p>Procuraduría Agraria</p>
    </div>

    <button class="btn btn-secondary" type="button" onclick="window.location.href='../dashboard.html'">
        Volver al menú
    </button>
</header>



<main class="app-main">
    
    <section class="page-title">
        <h2>Captura de gasto de gasolina</h2>
    </section>


    <section class="card">
        <h2>Consultar vehículo y presupuesto</h2>

        <div class="form-group">
            <label for="vehiculo_id">*Elige un vehículo:</label>
            
            <select name="vehiculo" id="vehiculo_id" required>
                <option value="">Selecciona un vehículo</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="anio_gasto">*Año de gasto:</label>
            
            <input type="number" id="anio_gasto" name="anio_gasto" required>
        </div>

        <button class="btn btn-secondary" id="btnConsultarResumen" type="button">
            Consultar presupuesto
        </button>
    </section>


    <section class="card" id="resumen">
        <h2>Resumen</h2>
        <p>Selecciona un vehículo y año para consultar el presupuesto.</p>
    </section>


    <section class="card">
        <form id="registrar_gasto" class="form-grid" method="POST" autocomplete="off">
            <fieldset>
                <legend>Registrar gasto de gasolina</legend>

            <div class="form-group">
                <label for="salida_id">*Salida relacionada:</label>
                <select name="salida_id" id="salida_id" required>
                    <option value="">Primero consulta un vehículo</option>
                </select>
            </div>
                
            <div class="form-group">
                <label for="fecha_gasto">*Fecha del gasto:</label>
                <input type="date" id="fecha_gasto" name="fecha_gasto" required>
            </div>
                
            <div class="form-group">
                <label for="monto">*Monto del gasto:</label>
                <input type="number" step="0.01" id="monto" name="monto" required>
            </div>
                
            <div class="form-group">
                <label for="nivel_tanque">Nivel del tanque:</label>
                <select name="nivel_tanque" id="nivel_tanque">
                    <option value="">Selecciona nivel</option>
                    <option value="vacio">0</option>
                    <option value="cuarto">1/4</option>
                    <option value="medio">1/2</option>
                    <option value="tres_cuartos">3/4</option>
                    <option value="lleno">4/4</option>
                </select>
            </div>
                
            <div class="form-group">
                <label for="km_odometro">Odómetro al momento del gasto:</label>
                <input type="number" step="0.01" id="km_odometro" name="km_odometro">
            </div>
                
            <div class="form-group">
                <label for="nota">Observaciones:</label>
                <input type="text" id="nota" name="nota">
            </div>
                

                <input class="btn btn-primary" type="submit" value="Registrar gasto">
            </fieldset>
        </form>
    </section>

    <p id="mensaje" class="message"></p>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/gasto-gasolina.js"></script>

</main>
</body>
</html>
