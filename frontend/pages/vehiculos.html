<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vehículos</title>
</head>
<body>

    <h1>Gestión de vehículos</h1>

    <button type="button" onclick="window.location.href='../dashboard.html'">
        Volver al dashboard
    </button>

    <br><br>

    <section>
        <h2>Vehículos registrados</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Placa</th>
                    <th>Marca</th>
                    <th>Tipo</th>
                    <th>Modelo</th>
                    <th>Serie</th>
                    <th>Color</th>
                    <th>Km acumulado</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaVehiculos"></tbody>
        </table>

        <br>

        <button type="button" id="btnMostrarFormulario">
            Registrar vehículo
        </button>
    </section>

    <br>

    <section id="seccionFormulario" style="display: none;">
        <h2 id="tituloFormulario">Registrar vehículo</h2>

        <form id="formVehiculo" autocomplete="off">
            <input type="hidden" id="vehiculo_id_edicion">

            <label for="placa">*Placa:</label><br>
            <input type="text" id="placa" required>

            <br><br>

            <label for="marca">*Marca:</label><br>
            <input type="text" id="marca" required>

            <br><br>

            <label for="tipo">*Tipo:</label><br>
            <input type="text" id="tipo" required>

            <br><br>

            <label for="modelo_anio">*Año modelo:</label><br>
            <input type="number" id="modelo_anio" required>

            <br><br>

            <label for="cilindros">*Cilindros:</label><br>
            <input type="number" id="cilindros" required>

            <br><br>

            <label for="num_serie">*Número de serie:</label><br>
            <input type="text" id="num_serie" required>

            <br><br>

            <label for="num_motor">Número de motor:</label><br>
            <input type="text" id="num_motor">

            <br><br>

            <label for="num_poliza">Número de póliza:</label><br>
            <input type="text" id="num_poliza">

            <br><br>

            <label for="num_inventario">Número de inventario:</label><br>
            <input type="text" id="num_inventario">

            <br><br>

            <label for="color">*Color:</label><br>
            <input type="text" id="color" required>

            <br><br>

            <label for="num_tarjeta_gasolina">Número de tarjeta de gasolina:</label><br>
            <input type="text" id="num_tarjeta_gasolina">

            <br><br>

            <label for="km_acumulado">*Kilometraje acumulado:</label><br>
            <input type="number" step="0.01" id="km_acumulado" required>

            <br><br>

            <input type="submit" id="btnGuardar" value="Registrar vehículo">

            <button type="button" id="btnCancelarEdicion">
                Cancelar
            </button>
        </form>
    </section>

    <p id="mensaje"></p>

    <script src="../js/api.js"></script>
    <script src="../js/vehiculos.js"></script>
</body>
</html>
