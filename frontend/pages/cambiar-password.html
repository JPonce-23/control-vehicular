<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-roles="administrador,capturista">


<header class="app-header">
    <div>
        <h1>Control vehicular</h1>
        <p>Procuraduría Agraria</p>
    </div>

    <button class="btn btn-secondary" type="button" onclick="window.location.href='../dashboard.html'">
        Volver al menú
    </button>
</header>


<main class="app-main">

    

    <section class="page-title">
        <h2>Cambia tu contraseña</h2>
    </section>



    <section class="card">
        <form class="form-grid" id="formCambiarPassword" autocomplete="off">

            <div class="form-group">
                <label for="password_actual">*Contraseña actual:</label>
                <input type="password" id="password_actual" required>
            </div>

            <div class="form-group">
                <label for="nueva_password">*Nueva contraseña:</label>
                <input type="password" id="nueva_password" required>
            </div>
            
            <div class="form-group">
                <label for="confirmar_password">*Confirmar nueva contraseña:</label>
                <input type="password" id="confirmar_password" required>
            </div>
            

            <input type="submit" class="btn btn-primary" value="Cambiar contraseña">

        </form>
    </section>

    <p id="mensaje" class="message"></p>

    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/cambiar-password.js"></script>

</main>
</body>
</html>
