<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>
</head>
<body>

    <h1>Cambiar mi contraseña</h1>

    <button type="button" onclick="window.location.href='../dashboard.html'">
        Volver al dashboard
    </button>

    <br><br>

    <section>
        <form id="formCambiarPassword" autocomplete="off">

            <label for="password_actual">*Contraseña actual:</label><br>
            <input type="password" id="password_actual" required>

            <br><br>

            <label for="nueva_password">*Nueva contraseña:</label><br>
            <input type="password" id="nueva_password" required>

            <br><br>

            <label for="confirmar_password">*Confirmar nueva contraseña:</label><br>
            <input type="password" id="confirmar_password" required>

            <br><br>

            <input type="submit" value="Cambiar contraseña">

        </form>
    </section>

    <p id="mensaje"></p>

    <script src="../js/api.js"></script>
    <script src="../js/cambiar-password.js"></script>

</body>
</html>
