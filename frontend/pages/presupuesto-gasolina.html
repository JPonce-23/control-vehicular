<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Presupuesto de gasolina</title>
</head>
<body data-role="administrador">

    <h1>Presupuesto de gasolina</h1>

    <button type="button" onclick="window.location.href='../dashboard.html'">
        Volver al dashboard
    </button>

    <br><br>

    <section>
        <h2>Seleccionar vehículo</h2>

        <label for="vehiculo_id">*Selecciona un vehículo:</label><br>
        <select id="vehiculo_id" required>
            <option value="">Selecciona un vehículo</option>
        </select>

        <br><br>

        <label for="anio">*Año presupuestal:</label><br>
        <select id="anio" required>
            <option value="">Selecciona año</option>
        </select>

        <button type="button" id="btnConsultarPresupuesto">
            Consultar presupuesto
        </button>
    </section>

    <br>

    <section id="detalleVehiculo">
        <h2>Datos del vehículo</h2>
        <p>Selecciona un vehículo para ver su información.</p>
    </section>

    <br>

    <section id="resumenPresupuesto">
        <h2>Resumen del presupuesto</h2>
        <p>Selecciona un vehículo para consultar su presupuesto.</p>
    </section>

    <br>

    <section>
        <h2>Crear presupuesto</h2>

        <form id="formPresupuesto" autocomplete="off">

            <label for="monto_autorizado_total">*Monto autorizado total:</label><br>
            <input type="number" step="0.01" id="monto_autorizado_total" required>

            <br><br>

            <label for="mes_inicio">*Mes de inicio:</label><br>
            <select id="mes_inicio" required>
                <option value="">Selecciona mes</option>
            </select>

            <br><br>

            <label for="mes_fin">*Mes de fin:</label><br>
            <select id="mes_fin" required>
                <option value="">Selecciona mes</option>
            </select>

            <br><br>

            <section id="calculoPresupuesto">
                <p>Captura monto y rango de meses para calcular el monto mensual.</p>
            </section>

            <br>

            <input type="submit" value="Crear presupuesto">

        </form>
    </section>

    <p id="mensaje"></p>

    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/presupuesto-gasolina.js"></script>

</body>
</html>
